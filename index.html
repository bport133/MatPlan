<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Safari/iOS auto-detects phone numbers, times, dates and addresses
         in plain text and re-styles them as tap-to-act links in its own
         system blue — a styling layer page CSS can't override. A practice
         plan's start/end time and a team name are exactly the kind of text
         that gets caught, printing blue even after every other color fix. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <title>MatPlan — Wrestling Program Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
